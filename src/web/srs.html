<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SRS</title>
  <link rel="stylesheet" href="/assets/shared/font.css">
  <link rel="stylesheet" href="/assets/shared/theme.css">
  <style>
    /* Placeholder page (Phase 1, step 2): proves the slice arrives. The AE2 page replaces it. */
    html, body { margin: 0; height: 100%; background: var(--no-bg); color: var(--no-green); font-family: var(--no-font); }
    body { box-sizing: border-box; padding: 20px 48px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .head { display: flex; justify-content: space-between; align-items: baseline; }
    .title { font-size: 22px; letter-spacing: 0.08em; }
    #status { font-size: 12px; color: var(--no-green-dim); }
    #status.bad { color: var(--no-red); }
    table { border-collapse: collapse; font-size: 16px; }
    td { padding: 4px 14px 4px 0; }
    td.f { color: var(--no-white); }
    .tx { color: #000; background: var(--no-green); padding: 0 6px; }
    .rx { border: 1px solid var(--no-green); padding: 0 6px; }
    pre { margin: 0; flex: 1; overflow: auto; font-size: 11px; color: var(--no-green-dim); }
  </style>
</head>
<body>
  <div class="head"><span class="title">SRS</span><span id="status">WAITING FOR MISSION</span></div>
  <table id="radios"></table>
  <pre id="raw"></pre>
  <script type="module" src="/ext/srs/srs.js"></script>
</body>
</html>
