<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SRS</title>
  <link rel="stylesheet" href="/assets/shared/font.css">
  <link rel="stylesheet" href="/assets/shared/theme.css">
  <link rel="stylesheet" href="/ext/srs/srs.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="kp-glyph" viewBox="0 0 24 24"><circle cx="7" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="17" cy="4" r="1.6"/><circle cx="7" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="17" cy="9" r="1.6"/><circle cx="7" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/><circle cx="17" cy="14" r="1.6"/><circle cx="12" cy="19" r="1.6"/></symbol></svg>
<div class="stage" id="stage">

  <div class="head">
    <span class="title">SRS</span>
    <span class="status" id="status">WAITING FOR MISSION</span>
  </div>

  <div class="scope">
    <div class="scope-head">
      <span id="band">—</span>
      <span><span class="c1">COM 1</span> · <span class="c2">COM 2</span> · ━ ACTIVE <span class="p2">┅ STANDBY</span></span>
    </div>
    <svg id="scope" viewBox="0 0 844 150" role="img" aria-label="Band scope"></svg>
  </div>

  <section class="com sel" id="com1"></section>
  <section class="com" id="com2"></section>

  <div class="rads-head"><span>RADIOS</span><span class="p2">TAP A RADIO TO ASSIGN IT TO THE SELECTED COM</span></div>
  <div class="rads" id="rads"></div>
</div>
<script src="/ext/srs/srs-format.js"></script>
<script type="module" src="/ext/srs/srs.js"></script>
</body>
</html>
