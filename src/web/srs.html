<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SRS</title>
  <link rel="stylesheet" href="/assets/shared/font.css">
  <link rel="stylesheet" href="/assets/shared/theme.css">
  <link rel="stylesheet" href="/ext/srs/srs.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="kp-glyph" viewBox="0 0 24 24"><circle cx="7" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="17" cy="4" r="1.6"/><circle cx="7" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="17" cy="9" r="1.6"/><circle cx="7" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/><circle cx="17" cy="14" r="1.6"/><circle cx="12" cy="19" r="1.6"/></symbol></svg>
<div class="stage" id="stage">

  <div class="head">
    <span class="title">SRS</span>
    <span class="status" id="status">WAITING FOR MISSION</span>
    <!-- NOXMFD's AKF/TGT density switch: the knob slides to the active layout, whose label lights. -->
    <button class="layout-tog" id="layout-tog" data-act="layout" role="switch" aria-checked="false" aria-label="Dual band layout">
      <span class="lt-l">COMPACT</span><span class="lt-sw"><span class="lt-knob"></span></span><span class="lt-r">DUAL BAND</span>
    </button>
  </div>

  <!-- Compact: the selected radio's head, then every radio as a row. -->
  <div class="view" id="compact">
    <section class="com sel" id="cpt"></section>
    <div class="rads-head"><span>RADIOS</span><span>TAP A RADIO TO SELECT IT</span></div>
    <div class="rows" id="rows"></div>
  </div>

  <!-- Dual band: the AE2 design. -->
  <div class="view" id="dual">
  <div class="scope">
    <div class="scope-head">
      <span id="band">—</span>
      <span><span class="c1">PTT</span> · <span class="c2">MON</span> · ━ ACTIVE ┅ STANDBY</span>
    </div>
    <svg id="scope" viewBox="0 0 844 150" role="img" aria-label="Band scope"></svg>
  </div>

  <section class="com sel" id="com1"></section>
  <section class="com" id="com2"></section>

  <div class="rads-head"><span>RADIOS</span><span>TAP A RADIO TO TALK ON IT</span></div>
  <div class="rads" id="rads"></div>
  </div>

  <!-- Standby-frequency keypad, opened by tapping a head's STANDBY readout (the NOAutopilot
       page's keypad, adapted for frequencies). -->
  <div class="keypad-scrim" id="keypad" hidden>
    <div class="keypad" role="dialog" aria-labelledby="kp-title">
      <div class="kp-title" id="kp-title">STANDBY MHZ</div>
      <div class="kp-range" id="kp-range"></div>
      <div class="kp-display" id="kp-display"></div>
      <div class="kp-error" id="kp-error"></div>
      <div class="kp-grid" id="kp-grid">
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k=".">.</button><button class="key" data-k="0">0</button>
        <button class="key" data-k="back" aria-label="Delete"><svg viewBox="0 0 24 24" class="ico"><path d="M9 6h11v12H9l-5-6z"/><path d="M12 10l4 4M16 10l-4 4"/></svg></button>
      </div>
      <div class="kp-actions">
        <button class="key" id="kp-cancel">CANCEL</button>
        <button class="key kp-enter" id="kp-enter">ENTER</button>
      </div>
    </div>
  </div>
</div>
<script src="/ext/srs/srs-format.js"></script>
<script type="module" src="/ext/srs/srs.js"></script>
</body>
</html>
